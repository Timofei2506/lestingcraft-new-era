name = "lestingcraft-coop"
main = "src/worker.js"
compatibility_date = "2026-10-16"
workers_dev = true
compatibility_flags = ["nodejs_compat"]
[durable_objects]
bindings = [
  { name = "ROOMS", class_name = "GameRoom" },
  { name = "DIRECTORY", class_name = "RoomDirectory" },
  { name = "ACCOUNTS", class_name = "AccountDirectory" },
  { name = "SERVERS", class_name = "ServerRegistry" }
]
[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom", "RoomDirectory"]
# No R2, Neon, paid plan, or credentials required in the client.
# Use CLOUDFLARE_ACCOUNT_ID / CLOUDFLARE_API_TOKEN in shell or CI secrets.

[[migrations]]
tag = "v2-accounts"
new_sqlite_classes = ["AccountDirectory"]

[[migrations]]
tag = "v3-servers"
new_sqlite_classes = ["ServerRegistry"]
