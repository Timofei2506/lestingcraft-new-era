name = "lestingcraft"
main = "src/worker.mjs"
compatibility_date = "2025-09-01"
workers_dev = true
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

# Waitlist storage: KV namespace created 2026-10-24 for the production account.
[[kv_namespaces]]
binding = "WAITLIST"
id = "29a69f0f51924b8c8ded71c75c7a7409"

[[services]]
binding = "COOP"
service = "lestingcraft-coop"
