name: Crafting core
on:
  push:
    paths: ["Assets/Scripts/Gameplay/**", "Tools/check_crafting_core.cs", "Tools/check_fuel_core.cs", "Tools/check_stations_core.cs", "Tools/check_shuttle_core.cs", "Tools/check_interior_core.cs", "Assets/Scripts/Runtime/VerticalShuttleInteriorVisual.cs", "Assets/Scripts/Runtime/ShuttleInteriorPreview.cs", "Assets/Scripts/Runtime/FirstPersonController.cs", "Assets/Scripts/Runtime/PrototypeGame.cs", "Tools/check_moon_core.cs", "Tools/check_planet_travel_core.cs", "Tools/check_space_assets_core.cs", "Tools/check_station_visit_core.cs", "Assets/Scripts/Runtime/StationInteriorVisual.cs", "Assets/Scripts/Presentation/SettlerVisual.cs", "Assets/Tests/EditMode/StationVisitTests.cs", "Assets/Tests/EditMode/StationInteriorVisualTests.cs", "Tools/build_approved_space_models.py", "ArtSource/Space/Approved/**", "Assets/Resources/Space/**", "Assets/Scripts/Runtime/SpaceVoxelVisual.cs", "Assets/Scripts/Runtime/LaunchSiteVisual.cs", "Assets/Tests/EditMode/LaunchSiteVisualTests.cs", "Assets/Tests/EditMode/SpaceModelTests.cs", "Assets/Tests/EditMode/ShuttleCabinCarvingTests.cs", "Tools/check_zerog_core.cs", "Tools/check_suit_core.cs", "Tools/check_cockpit_core.cs", "Tools/build_station_model.py", "Tools/check_flight_core.cs", "Tools/check_expanded_core.cs", "Tools/check_skylight_core.cs", "Tools/check_nature_render.py", "Assets/Scripts/World/**", "Assets/Shaders/**", "Assets/Resources/*.shader", "Assets/Resources/GeneratedLeafOpacity.png", "Tools/check_art.py", "Tools/build_animal_materials.py", "Tools/check_content.py", "Assets/Art/PBR/**", "Assets/Resources/Models/**", "Assets/Resources/VoxelIcons/**", ".github/workflows/core.yml"]
  pull_request:
    paths: ["Assets/Scripts/Gameplay/**", "Tools/check_crafting_core.cs", "Tools/check_fuel_core.cs", "Tools/check_stations_core.cs", "Tools/check_shuttle_core.cs", "Tools/check_interior_core.cs", "Assets/Scripts/Runtime/VerticalShuttleInteriorVisual.cs", "Assets/Scripts/Runtime/ShuttleInteriorPreview.cs", "Assets/Scripts/Runtime/FirstPersonController.cs", "Assets/Scripts/Runtime/PrototypeGame.cs", "Tools/check_moon_core.cs", "Tools/check_planet_travel_core.cs", "Tools/check_space_assets_core.cs", "Tools/check_station_visit_core.cs", "Assets/Scripts/Runtime/StationInteriorVisual.cs", "Assets/Scripts/Presentation/SettlerVisual.cs", "Assets/Tests/EditMode/StationVisitTests.cs", "Assets/Tests/EditMode/StationInteriorVisualTests.cs", "Tools/build_approved_space_models.py", "ArtSource/Space/Approved/**", "Assets/Resources/Space/**", "Assets/Scripts/Runtime/SpaceVoxelVisual.cs", "Assets/Scripts/Runtime/LaunchSiteVisual.cs", "Assets/Tests/EditMode/LaunchSiteVisualTests.cs", "Assets/Tests/EditMode/SpaceModelTests.cs", "Assets/Tests/EditMode/ShuttleCabinCarvingTests.cs", "Tools/check_zerog_core.cs", "Tools/check_suit_core.cs", "Tools/check_cockpit_core.cs", "Tools/build_station_model.py", "Tools/check_flight_core.cs", "Tools/check_expanded_core.cs", "Tools/check_skylight_core.cs", "Tools/check_nature_render.py", "Assets/Scripts/World/**", "Assets/Shaders/**", "Assets/Resources/*.shader", "Assets/Resources/GeneratedLeafOpacity.png", "Tools/check_art.py", "Tools/build_animal_materials.py", "Tools/check_content.py", "Assets/Art/PBR/**", "Assets/Resources/Models/**", "Assets/Resources/VoxelIcons/**", ".github/workflows/core.yml"]
jobs:
  conservation:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq mono-mcs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet Pillow numpy
      - name: Compile real gameplay core and fuzz inventory transfers
        run: |
          mcs -langversion:7.2 -out:/tmp/crafting-check.exe Assets/Scripts/Gameplay/Weapons.cs Assets/Scripts/Gameplay/BodyPart.cs Assets/Scripts/Gameplay/ExpandedContent.cs Assets/Scripts/Gameplay/Equipment.cs Assets/Scripts/Gameplay/Inventory.cs Assets/Scripts/Gameplay/CraftingTable.cs Assets/Scripts/Gameplay/FurnaceState.cs Assets/Scripts/Gameplay/FuelChain.cs Tools/check_crafting_core.cs
          mono /tmp/crafting-check.exe
          mcs -langversion:7.2 -out:/tmp/fuel-check.exe Assets/Scripts/Gameplay/Weapons.cs Assets/Scripts/Gameplay/BodyPart.cs Assets/Scripts/Gameplay/ExpandedContent.cs Assets/Scripts/Gameplay/Equipment.cs Assets/Scripts/Gameplay/Inventory.cs Assets/Scripts/Gameplay/CraftingTable.cs Assets/Scripts/Gameplay/FurnaceState.cs Assets/Scripts/Gameplay/FuelChain.cs Tools/check_fuel_core.cs
          mono /tmp/fuel-check.exe
          mcs -langversion:7.2 -out:/tmp/stations-check.exe Assets/Scripts/Gameplay/Weapons.cs Assets/Scripts/Gameplay/BodyPart.cs Assets/Scripts/Gameplay/ExpandedContent.cs Assets/Scripts/Gameplay/Equipment.cs Assets/Scripts/Gameplay/Inventory.cs Assets/Scripts/Gameplay/CraftingTable.cs Assets/Scripts/Gameplay/FurnaceState.cs Assets/Scripts/Gameplay/FuelChain.cs Assets/Scripts/Gameplay/FuelStations.cs Tools/check_stations_core.cs
          mono /tmp/stations-check.exe
          mcs -langversion:7.2 -out:/tmp/shuttle-check.exe Assets/Scripts/Gameplay/OrbitalFlight.cs Assets/Scripts/Gameplay/ShuttleLaunch.cs Tools/check_shuttle_core.cs
          mono /tmp/shuttle-check.exe
          mcs -langversion:7.2 -out:/tmp/interior-check.exe Assets/Scripts/Gameplay/ShuttleLaunch.cs Assets/Scripts/Gameplay/CockpitPanel.cs Assets/Scripts/Gameplay/ShuttleInterior.cs Assets/Scripts/Gameplay/SpaceVoxelAsset.cs Assets/Scripts/Gameplay/ShuttleCabinCarving.cs Tools/check_interior_core.cs
          mono /tmp/interior-check.exe
          mcs -langversion:7.2 -out:/tmp/moon-check.exe Assets/Scripts/World/MoonTerrain.cs Tools/check_moon_core.cs
          mono /tmp/moon-check.exe
          mcs -langversion:7.2 -out:/tmp/planet-travel-check.exe Assets/Scripts/World/MoonTerrain.cs Assets/Scripts/World/PlanetTerrain.cs Assets/Scripts/Gameplay/SpaceNavigation.cs Tools/check_planet_travel_core.cs
          mono /tmp/planet-travel-check.exe
          python3 Tools/build_approved_space_models.py
          git diff --exit-code -- Assets/Resources/Space/
          mcs -langversion:7.2 -out:/tmp/space-assets-check.exe Assets/Scripts/Gameplay/SpaceVoxelAsset.cs Assets/Scripts/Gameplay/ShuttleCabinCarving.cs Assets/Scripts/Gameplay/LaunchPadLiftOpening.cs Tools/check_space_assets_core.cs
          mono /tmp/space-assets-check.exe
          mcs -langversion:7.2 -out:/tmp/station-visit-check.exe Assets/Scripts/Gameplay/Weapons.cs Assets/Scripts/Gameplay/BodyPart.cs Assets/Scripts/Gameplay/ExpandedContent.cs Assets/Scripts/Gameplay/Equipment.cs Assets/Scripts/Gameplay/Inventory.cs Assets/Scripts/Gameplay/CraftingTable.cs Assets/Scripts/Gameplay/FurnaceState.cs Assets/Scripts/Gameplay/FuelChain.cs Assets/Scripts/Gameplay/TradeOffer.cs Assets/Scripts/Gameplay/SpaceNavigation.cs Assets/Scripts/Gameplay/SettlerAppearance.cs Assets/Scripts/Gameplay/StationVisit.cs Tools/check_station_visit_core.cs
          mono /tmp/station-visit-check.exe
          mcs -langversion:7.2 -out:/tmp/zerog-check.exe Assets/Scripts/Gameplay/ZeroGFlight.cs Tools/check_zerog_core.cs
          mono /tmp/zerog-check.exe
          mcs -langversion:7.2 -out:/tmp/suit-check.exe Assets/Scripts/Gameplay/SpaceSuit.cs Tools/check_suit_core.cs
          mono /tmp/suit-check.exe
          mcs -langversion:7.2 -out:/tmp/cockpit-check.exe Assets/Scripts/Gameplay/ShuttleLaunch.cs Assets/Scripts/Gameplay/CockpitPanel.cs Tools/check_cockpit_core.cs
          mono /tmp/cockpit-check.exe
          python3 Tools/build_station_model.py
          mcs -langversion:7.2 -out:/tmp/flight-check.exe Assets/Scripts/Gameplay/OrbitalFlight.cs Tools/check_flight_core.cs
          mono /tmp/flight-check.exe
          mcs -langversion:7.2 -out:/tmp/expanded-check.exe Assets/Scripts/Gameplay/Weapons.cs Assets/Scripts/Gameplay/BodyPart.cs Assets/Scripts/Gameplay/ExpandedContent.cs Assets/Scripts/Gameplay/Equipment.cs Assets/Scripts/Gameplay/Inventory.cs Assets/Scripts/Gameplay/CraftingTable.cs Assets/Scripts/Gameplay/FurnaceState.cs Assets/Scripts/Gameplay/FuelChain.cs Assets/Scripts/Gameplay/WildlifeSimulation.cs Tools/check_expanded_core.cs
          mono /tmp/expanded-check.exe
          mcs -langversion:7.2 -out:/tmp/skylight-check.exe Assets/Scripts/Gameplay/ExpandedContent.cs Assets/Scripts/World/BlockRegistry.cs Assets/Scripts/World/ChunkData.cs Assets/Scripts/World/VoxelSkylight.cs Tools/check_skylight_core.cs
          mono /tmp/skylight-check.exe
      - name: Validate complete material / block / icon catalog
        run: |
          python -m pip install --quiet Pillow numpy
          python Tools/check_art.py
          python Tools/check_content.py
          python Tools/check_nature_render.py
