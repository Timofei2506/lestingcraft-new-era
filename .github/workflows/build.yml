# Публикационные цели: Windows x64 ZIP + Android ARM64 APK.
# Android подписывается временным Unity debug key; для будущего обновления может понадобиться переустановка.
# Запуск: тег v* или вручную (workflow_dispatch). Требует UNITY_USERNAME / UNITY_PASSWORD.
name: Build Windows and Android

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

permissions:
  contents: write

# Personal-лицензия имеет мало мест — не даём сборкам конкурировать за seat
concurrency:
  group: unity-license
  cancel-in-progress: false

jobs:
  check-secrets:
    name: Check Unity secrets
    runs-on: ubuntu-latest
    outputs:
      has: ${{ steps.check.outputs.has }}
    steps:
      - id: check
        env:
          UNITY_USERNAME: ${{ secrets.UNITY_USERNAME }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -n "$UNITY_USERNAME" ] && [ -n "$UNITY_PASSWORD" ]; then
            echo "has=true" >> "$GITHUB_OUTPUT"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
            echo "::error::Секреты UNITY_USERNAME/UNITY_PASSWORD не заданы — Windows и Android не собраны. Инструкция: Docs/Сборка-в-облаке.md"
            exit 1
          fi

  build:
    name: Build ${{ matrix.targetPlatform }}
    needs: check-secrets
    if: needs.check-secrets.outputs.has == 'true'
    runs-on: ${{ matrix.os }}
    # A genuine 30-minute lunar smoke mission plus editor installation cannot fit in 60 minutes.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: windows-latest
            targetPlatform: StandaloneWindows64
            buildMethod: BuildScript.BuildWindows64
            artifactPath: Builds/StandaloneWindows64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify current source and generated material inputs
        shell: pwsh
        run: |
          python -m pip install Pillow numpy
          python Tools/check_art.py
          if ($LASTEXITCODE -ne 0) { throw "PBR validation failed" }
          python Tools/check_content.py
          if ($LASTEXITCODE -ne 0) { throw "Content validation failed" }
          python Tools/build_source_receipt.py Builds/Logs/source-receipt.json
          if ($LASTEXITCODE -ne 0) { throw "Source receipt failed" }

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-build-${{ matrix.targetPlatform }}-${{ hashFiles('Packages/manifest.json', 'Assets/Editor/PresentationAssets.cs', 'Assets/Art/PBR/**') }}
          restore-keys: |
            Library-build-${{ matrix.targetPlatform }}-
            Library-

      - name: Set up Unity Hub for licensing only
        uses: buildalon/unity-setup@v2
        with:
          hub-version: 3.12.0
          auto-update-hub: false
          unity-version: None
          version-file: None
          modules: None
          cache-installation: false

      # A directory-only Editor cache omitted machine-level installer prerequisites (native startup 0x8007007e).
      # Use the verified installer on each cloud runner until a portable dependency-complete cache is proven.
      - name: Install verified Unity Editor directly (Windows Mono)
        shell: pwsh
        timeout-minutes: 28
        run: ./.github/scripts/install-unity-windows.ps1

      - name: Activate Unity license (Personal)
        id: activate
        continue-on-error: true
        uses: buildalon/activate-unity-license@v2
        with:
          license: 'Personal'
          username: ${{ secrets.UNITY_USERNAME }}
          password: ${{ secrets.UNITY_PASSWORD }}

      # Hub's licensing client can exit with ObjectDisposedException before authentication.
      # One bounded retry; an activation failure must still block building/uploading.
      - name: Brief backoff after licensing-client failure
        if: steps.activate.outcome == 'failure'
        shell: pwsh
        run: Start-Sleep -Seconds 15

      - name: Retry Unity license activation once
        if: steps.activate.outcome == 'failure'
        uses: buildalon/activate-unity-license@v2
        with:
          license: 'Personal'
          username: ${{ secrets.UNITY_USERNAME }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Build
        uses: buildalon/unity-action@v3
        with:
          log-name: build-${{ matrix.targetPlatform }}
          build-target: ${{ matrix.targetPlatform }}
          args: -quit -batchmode -nographics -executeMethod ${{ matrix.buildMethod }}

      - name: Smoke-test real menu with Direct3D WARP
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "Builds/StandaloneWindows64/LestingCraft.exe"
          $log = Join-Path $PWD "Builds/Logs/windows-smoke.log"
          New-Item -ItemType Directory -Force -Path (Split-Path $log) | Out-Null
          $args = @("-force-d3d11", "-force-driver-type-warp", "-screen-fullscreen", "0", "-screen-width", "1280", "-screen-height", "720", "-lc-smoke-test", "-logFile", $log)
          $process = Start-Process -FilePath $exe -ArgumentList $args -PassThru
          $null = $process.Handle
          if (-not $process.WaitForExit(3600000)) {
            Stop-Process -Id $process.Id -Force
            if (Test-Path $log) { Get-Content $log -Tail 100 }
            throw "Windows smoke test timed out"
          }
          if (-not (Test-Path $log)) { throw "Windows smoke log missing" }
          Get-Content $log -Tail 100
          $process.Refresh()
          $text = Get-Content $log -Raw
          if ($process.ExitCode -ne 0 -or $text -notmatch '\[Smoke\] PASS' -or $text -notmatch '\[Smoke\] LIVING6' -or $text -notmatch '\[Smoke\] SHUTTLE_INTERIOR' -or $text -match 'NullReferenceException|MissingReferenceException|Shader error|\[Smoke\] FAIL') {
            throw "Windows executable smoke test failed"
          }

      - name: Generate verified launcher manifest
        shell: pwsh
        run: python Tools/build_launcher_manifest.py "${{ matrix.artifactPath }}" "${{ github.sha }}" Builds/LauncherFeed/game-manifest.json

      - name: Upload launcher manifest
        uses: actions/upload-artifact@v4
        with:
          name: launcher-manifest
          path: Builds/LauncherFeed/game-manifest.json
          retention-days: 14
          if-no-files-found: error

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.targetPlatform }}
          path: ${{ matrix.artifactPath }}
          if-no-files-found: error

      - name: Upload executable screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-visual-screenshots
          path: Builds/StandaloneWindows64/SmokeResults
          if-no-files-found: error

      - name: Upload Unity build logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BuildLogs-${{ matrix.targetPlatform }}
          path: Builds/Logs
          if-no-files-found: warn

  build-android:
    name: Build Android ARM64 APK (temporary debug signature)
    needs: [check-secrets, build]
    if: needs.check-secrets.outputs.has == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk space for Android modules
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Verify current source and generated material inputs
        run: |
          python -m pip install Pillow numpy
          python Tools/check_art.py
          python Tools/check_content.py
          python Tools/build_source_receipt.py Builds/Logs/source-receipt.json

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-build-Android-${{ hashFiles('Packages/manifest.json', 'Assets/Editor/PresentationAssets.cs', 'Assets/Art/PBR/**') }}
          restore-keys: |
            Library-build-Android-
            Library-

      - name: Install Unity Editor + Android modules
        uses: buildalon/unity-setup@v2
        with:
          hub-version: 3.12.0
          cache-installation: true
          build-targets: Android

      - name: Activate Unity license (Personal)
        id: activate-android
        continue-on-error: true
        uses: buildalon/activate-unity-license@v2
        with:
          license: 'Personal'
          username: ${{ secrets.UNITY_USERNAME }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Brief backoff after licensing-client failure
        if: steps.activate-android.outcome == 'failure'
        run: sleep 15

      - name: Retry Unity license activation once
        if: steps.activate-android.outcome == 'failure'
        uses: buildalon/activate-unity-license@v2
        with:
          license: 'Personal'
          username: ${{ secrets.UNITY_USERNAME }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Build Android ARM64 APK
        uses: buildalon/unity-action@v3
        with:
          log-name: build-android-arm64
          build-target: Android
          args: -quit -batchmode -nographics -executeMethod BuildScript.BuildAndroidArm64

      - name: Verify APK output
        run: test -s Builds/Android/LestingCraft-Android-arm64.apk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-android-arm64
          path: Builds/Android/LestingCraft-Android-arm64.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android Unity logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BuildLogs-Android
          path: Builds/Logs
          if-no-files-found: warn

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package Windows ZIP and Android APK
        run: |
          set -euo pipefail
          test -s artifacts/build-StandaloneWindows64/LestingCraft.exe
          test -s artifacts/build-android-arm64/LestingCraft-Android-arm64.apk
          (cd artifacts/build-StandaloneWindows64 && zip -qr ../build-StandaloneWindows64.zip . -x 'SmokeResults/*')
          cp artifacts/build-android-arm64/LestingCraft-Android-arm64.apk artifacts/LestingCraft-Android-arm64.apk
          ls -lh artifacts/*.zip artifacts/*.apk

      # A public tag is NOT permission to ship an unfinished space demo. Require
      # screenshots from the actual smoke-tested EXE, not Blender or concept art.
      - name: Require and pack executable space screenshots
        shell: bash
        run: |
          set -euo pipefail
          shots=artifacts/Windows-visual-screenshots
          for name in menu elevator launch flight-cruise lunar-landing moon-surface mars-surface venus-surface mercury-surface station; do
            test -s "$shots/$name.png" || { echo "Missing EXE screenshot: $name.png" >&2; exit 1; }
            python3 - "$shots/$name.png" <<'PY'
          import struct,sys
          with open(sys.argv[1],'rb') as f: header=f.read(24)
          if len(header)<24 or header[:8]!=b'\x89PNG\r\n\x1a\n' or header[12:16]!=b'IHDR': raise SystemExit('Invalid PNG screenshot: '+sys.argv[1])
          width,height=struct.unpack('>II',header[16:24])
          if width<640 or height<360: raise SystemExit('Screenshot too small: '+sys.argv[1])
          PY
          done
          (cd "$shots" && zip -q ../../LestingCraft-Screenshots.zip menu.png elevator.png launch.png flight-cruise.png lunar-landing.png moon-surface.png mars-surface.png venus-surface.png mercury-surface.png station.png)
          mv LestingCraft-Screenshots.zip artifacts/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.zip
            artifacts/LestingCraft-Android-arm64.apk
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
