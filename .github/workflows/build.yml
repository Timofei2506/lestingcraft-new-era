# Облачная сборка: Windows + WebGL в Releases, WebGL на GitHub Pages.
# Лицензия — онлайн-вход по Unity ID (Personal), без .ulf-файлов.
# Запуск: тег v* или вручную (workflow_dispatch). Требует UNITY_USERNAME / UNITY_PASSWORD.
name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Personal-лицензия имеет мало мест — не даём сборкам конкурировать за seat
concurrency:
  group: unity-license
  cancel-in-progress: false

jobs:
  check-secrets:
    name: Check Unity secrets
    runs-on: ubuntu-latest
    outputs:
      has: ${{ steps.check.outputs.has }}
    steps:
      - id: check
        env:
          UNITY_USERNAME: ${{ secrets.UNITY_USERNAME }}
        run: |
          if [ -n "$UNITY_USERNAME" ]; then
            echo "has=true" >> "$GITHUB_OUTPUT"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Секреты UNITY_USERNAME/UNITY_PASSWORD не заданы — сборка пропущена. Инструкция: Docs/Сборка-в-облаке.md"
          fi

  build:
    name: Build ${{ matrix.targetPlatform }}
    needs: check-secrets
    if: needs.check-secrets.outputs.has == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - targetPlatform: StandaloneWindows64
            buildMethod: BuildScript.BuildWindows64
            artifactPath: Builds/StandaloneWindows64
          - targetPlatform: WebGL
            buildMethod: BuildScript.BuildWebGL
            artifactPath: Builds/WebGL
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-build-${{ matrix.targetPlatform }}-${{ hashFiles('Packages/manifest.json') }}
          restore-keys: |
            Library-build-${{ matrix.targetPlatform }}-
            Library-

      - name: Install Unity Editor
        uses: buildalon/unity-setup@v2
        with:
          build-targets: ${{ matrix.targetPlatform }}

      - name: Activate Unity license (Personal)
        uses: buildalon/activate-unity-license@v2
        with:
          license: 'Personal'
          username: ${{ secrets.UNITY_USERNAME }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Build
        uses: buildalon/unity-action@v3
        with:
          log-name: build-${{ matrix.targetPlatform }}
          build-target: ${{ matrix.targetPlatform }}
          args: -quit -batchmode -nographics -executeMethod ${{ matrix.buildMethod }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.targetPlatform }}
          path: ${{ matrix.artifactPath }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Pack zips
        run: |
          cd artifacts
          for d in build-*; do (cd "$d" && zip -qr "../$d.zip" .); done
          ls -la *.zip

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true

  deploy-pages:
    name: Deploy WebGL to GitHub Pages
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download WebGL build
        uses: actions/download-artifact@v4
        with:
          name: build-WebGL
          path: site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
