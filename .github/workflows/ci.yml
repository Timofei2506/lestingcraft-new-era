# Тесты ядра (EditMode). Лицензия — онлайн-вход по Unity ID (Personal), без .ulf-файлов.
# Требует секретов UNITY_USERNAME / UNITY_PASSWORD — см. Docs/Сборка-в-облаке.md
name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - 'Website/**'
      - 'Launcher/**'
      - 'Tools/build_launcher_manifest.py'
      - '.github/workflows/build.yml'
      - '.github/workflows/launcher.yml'
      - '.github/workflows/launcher-*.yml'
      - 'Docs/**'
      - 'README.md'
      - '.github/workflows/website.yml'
      - '.github/workflows/release-feed.yml'
      - '.github/workflows/showcase.yml'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - 'Website/**'
      - 'Launcher/**'
      - 'Tools/build_launcher_manifest.py'
      - '.github/workflows/build.yml'
      - '.github/workflows/launcher.yml'
      - '.github/workflows/launcher-*.yml'
      - 'Docs/**'
      - 'README.md'
      - '.github/workflows/website.yml'
      - '.github/workflows/release-feed.yml'
      - '.github/workflows/showcase.yml'
  workflow_dispatch:

# Personal-лицензия имеет мало мест — не даём сборкам конкурировать за seat
concurrency:
  group: unity-license
  cancel-in-progress: false

jobs:
  check-secrets:
    name: Check Unity secrets
    runs-on: ubuntu-22.04
    outputs:
      has: ${{ steps.check.outputs.has }}
    steps:
      - id: check
        env:
          UNITY_USERNAME: ${{ secrets.UNITY_USERNAME }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -n "$UNITY_USERNAME" ] && [ -n "$UNITY_PASSWORD" ]; then
            echo "has=true" >> "$GITHUB_OUTPUT"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Секреты UNITY_USERNAME/UNITY_PASSWORD не заданы — тесты пропущены. Инструкция: Docs/Сборка-в-облаке.md"
          fi

  tests:
    name: EditMode tests
    needs: check-secrets
    if: needs.check-secrets.outputs.has == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk space for Unity
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-tests-${{ hashFiles('Packages/manifest.json', 'Assets/Editor/PresentationAssets.cs', 'Assets/Art/PBR/**') }}
          restore-keys: |
            Library-tests-
            Library-

      - name: Install Unity Editor
        uses: buildalon/unity-setup@v2
        with:
          # Newer Linux Hub packages changed paths; pin compatible layout.
          hub-version: 3.12.0
          cache-installation: true
          build-targets: StandaloneLinux64

      - name: Activate Unity license (Personal)
        uses: buildalon/activate-unity-license@v2
        with:
          license: 'Personal'
          username: ${{ secrets.UNITY_USERNAME }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Run EditMode tests
        uses: buildalon/unity-action@v3
        with:
          log-name: editmode-tests
          build-target: StandaloneLinux64
          args: -batchmode -nographics -runTests -testPlatform EditMode -testResults ${{ github.workspace }}/TestResults/editmode.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TestResults
          path: TestResults
          if-no-files-found: warn

      - name: Upload Unity logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: UnityLogs
          path: Builds/Logs
          if-no-files-found: warn
