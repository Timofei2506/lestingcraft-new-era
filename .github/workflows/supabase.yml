name: Supabase schema

# Проверяет и применяет схему экономики при изменениях в Supabase/.
# Секрет SUPABASE_ACCESS_TOKEN (personal access token) и SUPABASE_PROJECT_REF
# добавляются в Settings → Secrets and variables → Actions.
# Без секрета job честно пропускается, а не падает красным.
on:
  push:
    branches: [main]
    paths:
      - 'Supabase/**'
      - '.github/workflows/supabase.yml'
  pull_request:
    paths:
      - 'Supabase/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-schema
  cancel-in-progress: false

jobs:
  credentials:
    name: Check Supabase secrets
    runs-on: ubuntu-latest
    outputs:
      has: ${{ steps.check.outputs.has }}
    steps:
      - id: check
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_PROJECT_REF" ]; then
            echo "has=true" >> "$GITHUB_OUTPUT"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF не заданы — проверка схемы пропущена."
          fi

  schema:
    name: Apply schema and verify economy
    needs: credentials
    if: needs.credentials.outputs.has == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply schema
        working-directory: Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: npm run db:apply
      - name: Verify economy end to end (rolled back)
        working-directory: Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: npm run db:verify
