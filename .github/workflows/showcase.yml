name: Showcase Screenshots (Linux 64)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Capture set"
        required: true
        default: "era-v9"
        type: choice
        options:
          - era-v9
          - forest-review
          - space-review

concurrency:
  group: unity-license
  cancel-in-progress: false

jobs:
  showcase:
    name: Build & Capture Unity showcase
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk space for Unity
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install Xvfb, Mesa OpenGL 4.5 & IL2CPP clang toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils clang lld zlib1g-dev

      - name: Restore Library & IL2CPP Cache
        uses: actions/cache/restore@v4
        with:
          path: Library
          key: Library-il2cpp-v3-${{ hashFiles('Assets/Scripts/**/*.cs', 'Assets/Editor/**/*.cs', 'Packages/manifest.json') }}
          restore-keys: |
            Library-il2cpp-v3-

      - name: Drop stale Bee build graph
        run: rm -rf Library/Bee

      - name: Install Unity Editor
        uses: buildalon/unity-setup@v2
        with:
          hub-version: 3.12.0
          cache-installation: true
          build-targets: StandaloneLinux64

      - name: Activate Unity license (Personal)
        uses: buildalon/activate-unity-license@v2
        with:
          license: 'Personal'
          username: ${{ secrets.UNITY_USERNAME }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Run EditMode tests (review)
        if: inputs.mode == 'forest-review' || inputs.mode == 'space-review'
        uses: buildalon/unity-action@v3
        with:
          log-name: forest-review-editmode
          build-target: StandaloneLinux64
          args: -batchmode -nographics -runTests -testPlatform EditMode -testResults ${{ github.workspace }}/TestResults/editmode.xml

      - name: Build StandaloneLinux64 Player
        uses: buildalon/unity-action@v3
        with:
          log-name: build-StandaloneLinux64
          build-target: StandaloneLinux64
          args: -quit -batchmode -nographics -executeMethod BuildScript.BuildLinux64

      - name: Save Full IL2CPP Library Cache Always
        if: always()
        uses: actions/cache/save@v4
        with:
          path: Library
          key: Library-il2cpp-v3-${{ hashFiles('Assets/Scripts/**/*.cs', 'Assets/Editor/**/*.cs', 'Packages/manifest.json') }}

      - name: Render authentic player screenshots
        run: |
          chmod +x Builds/StandaloneLinux64/LestingCraft.x86_64
          ls -lh Builds/StandaloneLinux64/
          mkdir -p Builds/StandaloneLinux64/ShowcaseResults Builds/StandaloneLinux64/VisualReview Builds/Logs
          if [ "${{ inputs.mode }}" = "space-review" ]; then
            timeout -k 10 900 xvfb-run -a -s "-screen 0 1600x900x24" \
              env LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe LP_NUM_THREADS=4 \
              ./Builds/StandaloneLinux64/LestingCraft.x86_64 \
              -force-glcore -screen-fullscreen 0 -screen-width 1600 -screen-height 900 \
              -lc-space-review -logFile Builds/Logs/space-review.log
            echo "=== Space review log tail ==="; tail -n 160 Builds/Logs/space-review.log || true
            grep -q "\[VisualReview\] PASS" Builds/Logs/space-review.log
            test "$(find Builds/StandaloneLinux64/VisualReview -maxdepth 1 -name '*.png' | wc -l)" -eq 5
          elif [ "${{ inputs.mode }}" = "forest-review" ]; then
            timeout -k 10 900 xvfb-run -a -s "-screen 0 1600x900x24" \
              env LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe LP_NUM_THREADS=4 \
              ./Builds/StandaloneLinux64/LestingCraft.x86_64 \
              -force-glcore -screen-fullscreen 0 -screen-width 1600 -screen-height 900 \
              -lc-visual-review -logFile Builds/Logs/visual-review.log
            echo "=== Visual review log tail ==="; tail -n 160 Builds/Logs/visual-review.log || true
            grep -q "\[VisualReview\] PASS" Builds/Logs/visual-review.log
            test "$(find Builds/StandaloneLinux64/VisualReview -maxdepth 1 -name '*.png' | wc -l)" -eq 8
            # A green run is not a picture: duplicate or blank frames have passed before.
            python3 -m pip install --quiet Pillow numpy
            python3 Tools/check_review_frames.py Builds/StandaloneLinux64/VisualReview
          else
            timeout -k 10 1100 xvfb-run -a -s "-screen 0 1920x1080x24" \
              env LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe LP_NUM_THREADS=4 \
              ./Builds/StandaloneLinux64/LestingCraft.x86_64 \
              -force-glcore -screen-fullscreen 0 -screen-width 1920 -screen-height 1080 \
              -lc-showcase -logFile Builds/Logs/linux-showcase.log
            echo "=== Showcase log tail ==="; tail -n 200 Builds/Logs/linux-showcase.log || true
            grep -E "\[Showcase\]|\[Smoke\]|FAIL|Error|Exception" Builds/Logs/linux-showcase.log || true
            test -f Builds/StandaloneLinux64/ShowcaseResults/08-inventory-new-blocks-and-bed.png
            test -f Builds/StandaloneLinux64/ShowcaseResults/12-secret-666-thermonuclear-mushroom.png
            test "$(find Builds/StandaloneLinux64/ShowcaseResults -maxdepth 1 -name '*.png' | wc -l)" -eq 15
          fi

      - name: Upload showcase screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EraV9-Screenshots
          path: |
            Builds/StandaloneLinux64/ShowcaseResults/*.png
            Builds/StandaloneLinux64/VisualReview/*.png
            Builds/Logs/**
            TestResults/**
          retention-days: 30
