name: Showcase Screenshots (Linux 64)

on:
  workflow_dispatch:

concurrency:
  group: unity-license
  cancel-in-progress: false

jobs:
  showcase:
    name: Build & Capture 1920x1080 Era-v8 Screenshots
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk space for Unity
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install Xvfb, Mesa OpenGL 4.5 & IL2CPP clang toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils clang lld zlib1g-dev

      - name: Restore Library & IL2CPP Cache
        uses: actions/cache/restore@v4
        with:
          path: Library
          key: Library-il2cpp-v2-${{ hashFiles('Assets/Scripts/**/*.cs', 'Assets/Editor/**/*.cs', 'Packages/manifest.json') }}
          restore-keys: |
            Library-il2cpp-v2-
            Library-showcase-
            Library-tests-
            Library-

      - name: Install Unity Editor
        uses: buildalon/unity-setup@v2
        with:
          hub-version: 3.12.0
          cache-installation: true
          build-targets: StandaloneLinux64

      - name: Activate Unity license (Personal)
        uses: buildalon/activate-unity-license@v2
        with:
          license: 'Personal'
          username: ${{ secrets.UNITY_USERNAME }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Build StandaloneLinux64 Player
        uses: buildalon/unity-action@v3
        with:
          log-name: build-StandaloneLinux64
          build-target: StandaloneLinux64
          args: -quit -batchmode -nographics -executeMethod BuildScript.BuildLinux64

      - name: Save Full IL2CPP Library Cache Always
        if: always()
        uses: actions/cache/save@v4
        with:
          path: Library
          key: Library-il2cpp-v2-${{ hashFiles('Assets/Scripts/**/*.cs', 'Assets/Editor/**/*.cs', 'Packages/manifest.json') }}

      - name: Render 8 Authentic 1920x1080 Ultra URP Screenshots in Real Game Binary
        run: |
          chmod +x Builds/StandaloneLinux64/LestingCraft.x86_64
          ls -lh Builds/StandaloneLinux64/
          mkdir -p Builds/StandaloneLinux64/ShowcaseResults Builds/Logs
          xvfb-run -a -s "-screen 0 1920x1080x24" \
            env LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe LP_NUM_THREADS=4 \
            ./Builds/StandaloneLinux64/LestingCraft.x86_64 \
            -force-glcore \
            -screen-fullscreen 0 \
            -screen-width 1920 \
            -screen-height 1080 \
            -lc-showcase \
            -logFile Builds/Logs/linux-showcase.log
          grep -E "\\[Showcase\\]" Builds/Logs/linux-showcase.log || true
          test -f Builds/StandaloneLinux64/ShowcaseResults/08-inventory-new-blocks-and-bed.png
          ls -lh Builds/StandaloneLinux64/ShowcaseResults/

      - name: Upload 1920x1080 Showcase Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EraV8-Screenshots
          path: |
            Builds/StandaloneLinux64/ShowcaseResults/*.png
            Builds/Logs/**
          retention-days: 30

      - name: Upload StandaloneLinux64 Binary for Instant Replay
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: StandaloneLinux64-Player
          path: Builds/StandaloneLinux64/**
          retention-days: 3
