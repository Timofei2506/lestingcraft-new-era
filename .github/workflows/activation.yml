# Генерация файла ручной активации Unity (ALF) без установки редактора.
# Результат — артефакт unity-alf; инструкция: Docs/Сборка-в-облаке.md
name: Generate Unity activation file (ALF)

on:
  workflow_dispatch:

jobs:
  generate-alf:
    name: Generate .alf in Unity container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate manual activation file
        run: |
          docker run --rm -v "$PWD:/out" -w /out unityci/editor:ubuntu-6000.0.32f1-base-3 \
            bash -c "unity-editor -batchmode -nographics -createManualActivationFile -logfile /dev/stdout || true; ls -la /out"
          echo '--- ALF files ---'
          ls -la *.alf || echo 'ALF не создан — проверь тег образа unityci/editor'

      - name: Upload ALF artifact
        uses: actions/upload-artifact@v4
        with:
          name: unity-alf
          path: "*.alf"
          if-no-files-found: error
