name: Boss models · Blender art QA

# Not the Windows game build. Art-source candidates are exported for user review;
# they are NOT playable bosses, and user approval is required before game integration.
on:
  workflow_dispatch:
  push:
    paths:
      - 'ArtSource/BossModels/Candidates/**'

permissions:
  contents: read

jobs:
  boss-meshes:
    name: Export & render authored boss models
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Check 3 editable model candidates exist (fail rather than render fake placeholders)
        run: |
          for name in Mars Venus Mercury; do
            if [ ! -s "ArtSource/BossModels/Candidates/${name}.blend" ]; then
              echo "::error::Missing real editable 3D candidate: ArtSource/BossModels/Candidates/${name}.blend"
              exit 1
            fi
          done
      - name: Install pinned Blender 4.3.2 (matching authored .blend source)
        run: |
          curl -fsSL --retry 3 -A 'Mozilla/5.0' \
            https://download.blender.org/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz \
            -o "$RUNNER_TEMP/blender.tar.xz"
          echo "4da1c956673c0485e63054e563ee69198cc8f80d8157dd7592dffc8a6a5592e6  $RUNNER_TEMP/blender.tar.xz" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/blender"
          tar -xf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP/blender" --strip-components=1
          echo "$RUNNER_TEMP/blender" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/blender/blender" -b -noaudio --python-expr 'import bpy; print("Art build Blender", bpy.app.version_string)'
      - name: Real mesh / UV / eye / anatomy / PBR / transparency checks + FBX and GLB exports
        run: |
          for name in Mars Venus Mercury; do
            blender -b -t 4 -noaudio --python-exit-code 23 --python Tools/boss_art_ci.py -- "$name"
          done
      - name: Deliver review renders and actual 3D meshes (not integrated in Unity)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boss-models-art-review-${{ github.sha }}
          path: BossModelReview/
          if-no-files-found: warn
          retention-days: 14
