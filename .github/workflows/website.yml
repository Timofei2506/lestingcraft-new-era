name: Website tests and deployment
on:
  workflow_dispatch:
  push:
    paths: ["Website/**", ".github/workflows/website.yml"]
  pull_request:
    paths: ["Website/**", ".github/workflows/website.yml"]
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Website/package-lock.json
      - run: npm ci && npm test
        working-directory: Website
      - run: npx playwright install --with-deps chromium
        working-directory: Website
      - run: npm run test:browser
        working-directory: Website

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: website-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Website/package-lock.json
      - run: npm ci
        working-directory: Website
      - name: Publish existing website after tests pass
        working-directory: Website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Cloudflare GitHub Secrets are required.'; exit 1; }
          npm run deploy
      # Tell Bing and Yandex (IndexNow) that the pages changed. No account needed:
      # the key file lives at the site root and proves we own the host.
      - name: Submit pages to IndexNow
        run: |
          key=$(ls Website/public/*.txt | grep -v robots.txt | xargs -n1 basename | sed 's/\.txt$//' | head -1)
          echo "IndexNow key: $key"
          curl -sS -m 20 -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "$(python3 - "$key" <<'PY'
          import json, sys
          key = sys.argv[1]
          base = 'https://lestingcraft.kroterallitir.workers.dev'
          pages = ['/', '/press/', '/privacy/', '/license/', '/play-with-friends/']
          print(json.dumps({'host': 'lestingcraft.kroterallitir.workers.dev',
                            'key': key, 'keyLocation': f'{base}/{key}.txt',
                            'urlList': [base + p for p in pages]}, ensure_ascii=False))
          PY
          )" -w '\nIndexNow HTTP %{http_code}\n' | tail -5
