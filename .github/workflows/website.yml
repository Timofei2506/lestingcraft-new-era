name: Website tests and deployment
on:
  workflow_dispatch:
  push:
    paths: ["Website/**", ".github/workflows/website.yml"]
  pull_request:
    paths: ["Website/**", ".github/workflows/website.yml"]
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Website/package-lock.json
      - run: npm ci && npm test
        working-directory: Website
      - run: npx playwright install --with-deps chromium
        working-directory: Website
      - run: npm run test:browser
        working-directory: Website

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: website-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Website/package-lock.json
      - run: npm ci
        working-directory: Website
      - name: Publish existing website after tests pass
        working-directory: Website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Cloudflare GitHub Secrets are required.'; exit 1; }
          npm run deploy
