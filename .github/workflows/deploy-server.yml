name: Deploy coop server
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: coop-server-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Server/package-lock.json
      - run: npm ci && npm test
        working-directory: Server
      - name: Deploy existing Worker (no new paid services)
        working-directory: Server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Add Cloudflare credentials in GitHub Secrets, not in chat/source.'; exit 1; }
          npm run deploy
